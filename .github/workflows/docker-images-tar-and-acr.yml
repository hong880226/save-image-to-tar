name: Build Docker Images Tar & Push to Aliyun ACR

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (linux/amd64 or linux/arm64)"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
      create_release:
        description: "Create GitHub Release with tar"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    env:
      ACR_REGION: cn-hangzhou
      ACR_NAMESPACE: temporary-repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine platform
        id: set-platform
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            PLATFORM="linux/amd64"
          fi
          echo "PLATFORM=${PLATFORM}" >> $GITHUB_ENV
          echo "Using platform: ${PLATFORM}"

      - name: Parse images.txt and pull images
        run: |
          if [ ! -f images.txt ]; then
            echo "images.txt not found in repo root." >&2
            exit 1
          fi

          IMAGES=()
          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" | grep -qE '^[#]' && continue
            IMAGES+=("$line")
          done < images.txt

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "No images found in images.txt" >&2
            exit 1
          fi

          printf '%s\n' "${IMAGES[@]}" > images.list

          echo "Images to pull (platform=${PLATFORM}):"
          printf '  - %s\n' "${IMAGES[@]}"

          for img in "${IMAGES[@]}"; do
            echo "Pulling $img ..."
            docker pull --platform "${PLATFORM}" "$img"
          done

      - name: Save images to tar
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="run-${GITHUB_RUN_ID}"
          fi

          PLATFORM_SAFE="$(echo "${PLATFORM}" | tr '/' '-')"
          TAR_NAME="docker-images-bundle-${VERSION}-${PLATFORM_SAFE}.tar"

          echo "Saving images to ${TAR_NAME}"
          docker save $(cat images.list) -o "${TAR_NAME}"
          ls -lh "${TAR_NAME}"

          echo "TAR_NAME=${TAR_NAME}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "PLATFORM_SAFE=${PLATFORM_SAFE}" >> $GITHUB_ENV

      - name: Upload tar as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-bundle-${{ env.VERSION }}-${{ env.PLATFORM_SAFE }}
          path: ${{ env.TAR_NAME }}
          retention-days: 7

      - name: Login to Aliyun ACR
        env:
          ACR_USERNAME: ${{ secrets.ALIYUN_ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          if [ -z "$ACR_USERNAME" ] || [ -z "$ACR_PASSWORD" ]; then
            echo "ALIYUN_ACR_USERNAME or ALIYUN_ACR_PASSWORD is not set." >&2
            exit 1
          fi

          ACR_REGISTRY="registry.${ACR_REGION}.aliyuncs.com"
          echo "Logging in to ${ACR_REGISTRY}"
          echo "$ACR_PASSWORD" | docker login "${ACR_REGISTRY}" -u "$ACR_USERNAME" --password-stdin

          echo "ACR_REGISTRY=${ACR_REGISTRY}" >> $GITHUB_ENV

      - name: Retag and push images to Aliyun ACR
        run: |
          ACR_REGISTRY="${ACR_REGISTRY}"
          NAMESPACE="${ACR_NAMESPACE}"

          echo "Retagging and pushing images to ${ACR_REGISTRY}/${NAMESPACE}/ ..."

          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" | grep -qE '^[#]' && continue

            SRC_IMG="$line"

            if echo "$SRC_IMG" | grep -q ':'; then
              REPO_PART="${SRC_IMG%:*}"
              TAG_PART="${SRC_IMG##*:}"
            else
              REPO_PART="$SRC_IMG"
              TAG_PART="latest"
            fi

            REPO_NAME="${REPO_PART##*/}"
            DEST_IMG="${ACR_REGISTRY}/${NAMESPACE}/${REPO_NAME}:${TAG_PART}"

            echo "Source:      $SRC_IMG"
            echo "Destination: $DEST_IMG"

            docker tag "$SRC_IMG" "$DEST_IMG"
            docker push "$DEST_IMG"

          done < images.list

      - name: Create GitHub Release (tag push)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual, create_release=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
