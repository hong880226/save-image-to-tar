name: Build JAI Portable

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "上游分支、标签或提交 SHA"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Windows x64 Portable
    runs-on: windows-latest

    steps:
      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: JNNarrator/jai-gateway
          ref: ${{ inputs.source_ref }}
          path: source
          persist-credentials: false

      - name: Record source revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $sha = git -C source rev-parse HEAD
          if ($LASTEXITCODE -ne 0) {
            throw "无法读取源码提交 SHA"
          }

          "SOURCE_SHA=$sha" >> $env:GITHUB_ENV
          Write-Host "Source commit: $sha"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: source/ui/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            source -> target

      - name: Install frontend dependencies
        run: pnpm --dir source/ui install --frozen-lockfile

      - name: Configure portable build
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $configPath = Join-Path `
            $env:GITHUB_WORKSPACE `
            "source/src-tauri/tauri.conf.json"

          $config = Get-Content $configPath -Raw | ConvertFrom-Json

          # 禁止安装包及 updater 签名产物。
          # 注意：这不会禁用源码中的自动更新调用。
          $config.bundle.active = $false
          $config.bundle.createUpdaterArtifacts = $false

          $json = $config | ConvertTo-Json -Depth 100
          $utf8 = [System.Text.UTF8Encoding]::new($false)

          [System.IO.File]::WriteAllText($configPath, $json, $utf8)

      - name: Build application
        uses: tauri-apps/tauri-action@v0
        with:
          projectPath: source
          args: --ci --no-bundle

      - name: Inspect frontend output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $dist = Join-Path $env:GITHUB_WORKSPACE "source/ui/dist"
          $diag = Join-Path $env:GITHUB_WORKSPACE "diagnostics"

          New-Item -ItemType Directory -Force -Path $diag | Out-Null

          if (!(Test-Path "$dist/index.html")) {
            throw "未找到前端 dist/index.html"
          }

          "Source commit: $env:SOURCE_SHA" |
            Set-Content "$diag/source.txt" -Encoding utf8

          Write-Host "=== Frontend package.json ==="
          Get-Content "source/ui/package.json"

          Write-Host "=== Generated index.html ==="
          Get-Content "$dist/index.html"

          Write-Host "=== Frontend file list ==="
          Get-ChildItem $dist -Recurse -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize |
            Out-String -Width 240 |
            Tee-Object -FilePath "$diag/frontend-files.txt" |
            Write-Host

          $cssFiles = @(
            Get-ChildItem $dist -Recurse -Filter "*.css" -File
          )

          if ($cssFiles.Count -eq 0) {
            Write-Warning "未发现独立 CSS 文件，请检查是否通过 JS 注入样式。"
          }

          $report = @()

          foreach ($file in $cssFiles) {
            $css = Get-Content $file.FullName -Raw

            $report += "CSS: $($file.Name)"
            $report += "Bytes: $($file.Length)"
            $report += "@layer: $($css.Contains('@layer'))"
            $report += "@property: $($css.Contains('@property'))"
            $report += "oklch(): $($css.Contains('oklch('))"
            $report += ""
          }

          $report |
            Set-Content "$diag/css-features.txt" -Encoding utf8

          Get-Content "$diag/css-features.txt"

      - name: Package portable application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $releaseDir = Join-Path `
            $env:GITHUB_WORKSPACE "source/target/release"

          $packageDir = Join-Path `
            $env:GITHUB_WORKSPACE "package/JAI-portable"

          $artifactDir = Join-Path `
            $env:GITHUB_WORKSPACE "artifacts"

          if (!(Test-Path $releaseDir)) {
            throw "未找到 target/release，请检查 Cargo 输出目录。"
          }

          $executables = @(
            Get-ChildItem $releaseDir -Filter "*.exe" -File
          )

          if ($executables.Count -ne 1) {
            $names = $executables.Name -join ", "
            throw "预期一个应用 EXE，实际找到 $($executables.Count) 个：$names。请明确选择主程序后调整脚本。"
          }

          $exeName = $executables[0].Name

          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          Copy-Item $executables[0].FullName -Destination $packageDir

          Get-ChildItem $releaseDir -Filter "*.dll" -File |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $packageDir
            }

          Get-ChildItem "source" -File |
            Where-Object { $_.Name -match "^(LICENSE|COPYING)" } |
            ForEach-Object {
              Copy-Item $_.FullName -Destination $packageDir
            }

          # 启动脚本：
          # 如果 WebView2/msedgewebview2.exe 存在，优先使用该固定运行时；
          # 否则使用系统自动发现的运行时。
          $launcher = @'
          @echo off
          setlocal
          cd /d "%~dp0"

          set "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER="

          if exist "%~dp0WebView2\msedgewebview2.exe" (
            set "WEBVIEW2_BROWSER_EXECUTABLE_FOLDER=%~dp0WebView2"
            echo Using bundled WebView2 runtime.
          ) else (
            echo Using system WebView2 runtime.
          )

          start "" "%~dp0__APP_EXE__%"
          endlocal
          '@

          $launcher = $launcher.Replace("__APP_EXE__", $exeName)

          [System.IO.File]::WriteAllText(
            (Join-Path $packageDir "Start-JAI.cmd"),
            $launcher,
            [System.Text.Encoding]::ASCII
          )

          @"
          JAI Gateway Windows x64 Portable

          Upstream: https://github.com/JNNarrator/jai-gateway
          Source commit: $env:SOURCE_SHA
          Application: $exeName

          使用方法：
          1. 完整解压到本地可写目录。
          2. 双击 Start-JAI.cmd。

          可选的绿色 WebView2：
          将固定版本 x64 WebView2 完整文件放到 WebView2 子目录。
          必须存在 WebView2/msedgewebview2.exe。
          启动脚本会优先使用它。

          注意：
          - 此包未附带 WebView2。
          - 未改变原应用的数据库、配置和凭据存储路径。
          - 未禁用源码中的自动更新；请暂勿执行应用内更新。
          - 这是自行构建版本，不是上游官方发行包。
          "@ | Set-Content `
            (Join-Path $packageDir "PORTABLE-README.txt") `
            -Encoding utf8

          $zipPath = Join-Path `
            $artifactDir "JAI-windows-x64-portable.zip"

          Compress-Archive `
            -Path $packageDir `
            -DestinationPath $zipPath `
            -Force

          Get-ChildItem $packageDir |
            Format-Table Name, Length

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: JAI-windows-x64-portable
          path: artifacts/JAI-windows-x64-portable.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload frontend diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JAI-frontend-diagnostics
          path: |
            diagnostics/
            source/ui/dist/
            source/ui/package.json
            source/ui/vite.config.*
            source/ui/tailwind.config.*
            source/ui/postcss.config.*
          if-no-files-found: warn
          retention-days: 14
