name: Build Docker Images Tar (stream)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Target platform (linux/amd64 or linux/arm64)"
        required: true
        default: "linux/amd64"
        type: choice
        options:
          - linux/amd64
          - linux/arm64
      create_release:
        description: "Create GitHub Release with tar.gz"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  push:
    tags:
      - "v*"

jobs:
  build-tar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space (remove preinstalled stuff)
        run: |
          set -eux
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/lib/android || true
          df -h

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine platform
        run: |
          set -eux
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            PLATFORM="${{ github.event.inputs.platform }}"
          else
            PLATFORM="linux/amd64"
          fi
          echo "PLATFORM=${PLATFORM}" >> "$GITHUB_ENV"
          echo "Using platform: ${PLATFORM}"

      - name: Prune docker caches (before pull)
        run: |
          set -eux
          docker system df || true
          docker builder prune -af || true
          docker system prune -af --volumes || true
          docker system df || true
          df -h

      - name: Parse images.txt and pull images
        run: |
          set -eux

          if [ ! -f images.txt ]; then
            echo "images.txt not found in repo root." >&2
            exit 1
          fi

          IMAGES=()
          while IFS= read -r line; do
            line="$(echo "$line" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            [ -z "$line" ] && continue
            echo "$line" | grep -qE '^[#]' && continue
            IMAGES+=("$line")
          done < images.txt

          if [ ${#IMAGES[@]} -eq 0 ]; then
            echo "No images found in images.txt" >&2
            exit 1
          fi

          printf '%s\n' "${IMAGES[@]}" > images.list

          echo "Images to pull (platform=${PLATFORM}):"
          printf '  - %s\n' "${IMAGES[@]}"

          for img in "${IMAGES[@]}"; do
            echo "Pulling $img ..."
            docker pull --platform "${PLATFORM}" "$img"
          done

          docker system df || true
          df -h

      - name: Save images to tar.gz (stream, low disk usage)
        run: |
          set -eux

          if [ "${GITHUB_EVENT_NAME}" = "push" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="run-${GITHUB_RUN_ID}"
          fi

          PLATFORM_SAFE="$(echo "${PLATFORM}" | tr '/' '-')"
          TAR_NAME="docker-images-bundle-${VERSION}-${PLATFORM_SAFE}.tar.gz"

          echo "Saving images to ${TAR_NAME}"
          docker save $(cat images.list) | gzip -1 > "${TAR_NAME}"
          ls -lh "${TAR_NAME}"

          echo "TAR_NAME=${TAR_NAME}" >> "$GITHUB_ENV"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "PLATFORM_SAFE=${PLATFORM_SAFE}" >> "$GITHUB_ENV"

      - name: Upload tar.gz as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-images-bundle-${{ env.VERSION }}-${{ env.PLATFORM_SAFE }}
          path: ${{ env.TAR_NAME }}
          retention-days: 7

      - name: Create GitHub Release (tag push)
        if: github.event_name == 'push' && github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (manual, create_release=true)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.TAR_NAME }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup (always)
        if: always()
        run: |
          rm -f "${{ env.TAR_NAME }}" || true
          docker system prune -af --volumes || true
          df -h
