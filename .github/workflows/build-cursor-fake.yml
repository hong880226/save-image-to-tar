name: build-cursor-fake-windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "cursor-fake 分支/commit/tag（留空默认 master）"
        required: false
        default: "master"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout cursor-fake
        uses: actions/checkout@v4
        with:
          repository: hong880226/videcode-fake
          ref: ${{ inputs.ref }}
          path: cursor-fake

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Build portable exe
        working-directory: cursor-fake
        run: |
          go mod download
          set GOOS=windows
          set GOARCH=amd64
          set CGO_ENABLED=0
          go build -trimpath -ldflags "-s -w" -o cursor-fake.exe .

      - name: Pack zip
        working-directory: cursor-fake
        run: |
          powershell -Command "Compress-Archive -Path cursor-fake.exe -DestinationPath cursor-fake-windows-amd64.zip -Force"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-fake-windows-portable
          path: |
            cursor-fake/cursor-fake.exe
            cursor-fake/cursor-fake-windows-amd64.zip
