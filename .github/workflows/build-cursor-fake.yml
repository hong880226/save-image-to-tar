name: build-cursor-fake-windows

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "cursor-fake 分支/commit/tag（留空默认 master）"
        required: false
        default: "master"

jobs:
  build:
    runs-on: windows-latest
    env:
      TARGET_REPO: hong880226/videcode-fake
      TARGET_REF: ${{ inputs.ref }}
      REPO_READ_TOKEN: ${{ secrets.REPO_READ_TOKEN }}

    steps:
      # 1) 如果配置了私有仓库读取 token，则走带 token 的 checkout
      - name: Checkout target repo with token
        if: ${{ env.REPO_READ_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: cursor-fake
          token: ${{ env.REPO_READ_TOKEN }}

      # 2) 如果没有 token，则按 public 仓库方式 checkout
      - name: Checkout target repo without token
        if: ${{ env.REPO_READ_TOKEN == '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_REF }}
          path: cursor-fake

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Show Go env
        working-directory: cursor-fake
        shell: cmd
        run: |
          go version
          go env

      - name: Build portable exe
        working-directory: cursor-fake
        shell: cmd
        run: |
          go mod download
          set GOOS=windows
          set GOARCH=amd64
          set CGO_ENABLED=0
          go build -trimpath -ldflags "-s -w" -o cursor-fake.exe .

      - name: Pack zip
        working-directory: cursor-fake
        shell: powershell
        run: |
          Compress-Archive -Path cursor-fake.exe -DestinationPath cursor-fake-windows-amd64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursor-fake-windows-portable
          path: |
            cursor-fake/cursor-fake.exe
            cursor-fake/cursor-fake-windows-amd64.zip
