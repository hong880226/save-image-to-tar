name: build-wsl-rootfs-from-source

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (tag/branch/commit), e.g. v2026.3.8"
        required: false
        default: "main"
  push:
    tags:
      - "wsl-src-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.ref }}
          path: openclaw

      - name: Setup Node (build-time)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: openclaw/package-lock.json

      - name: Build OpenClaw
        working-directory: openclaw
        run: |
          npm ci
          npm run build
          # 如果项目有产物目录（例如 dist/ 或 build/），这里可加校验
          ls -la

      - name: Build WSL rootfs
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap zstd tar jq curl rsync
          chmod +x openclaw/scripts/build-rootfs-from-dist.sh
          sudo bash openclaw/scripts/build-rootfs-from-dist.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-wsl-rootfs
          path: openclaw/dist/*.tar.zst

      - name: Create GitHub Release (only on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openclaw/dist/*.tar.zst
