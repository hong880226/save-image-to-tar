name: build-wsl-rootfs

on:
  workflow_dispatch:
    inputs:
      openclaw_version:
        description: "npm version/tag for openclaw (e.g. 2026.3.9 / latest / beta / dev)"
        required: false
        default: "latest"
      gateway_port:
        description: "Default gateway port baked into start-openclaw.sh"
        required: false
        default: "18789"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repo (contains scripts/build-wsl-rootfs.sh)
        uses: actions/checkout@v4

      - name: Build WSL rootfs (Debian 12 + Node 22 + openclaw from npm)
        env:
          OUT_DIR: ${{ github.workspace }}/dist
          OPENCLAW_VERSION: ${{ inputs.openclaw_version }}
          GATEWAY_PORT: ${{ inputs.gateway_port }}
        run: |
          chmod +x scripts/build-wsl-rootfs.sh
          sudo -E bash scripts/build-wsl-rootfs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-wsl-rootfs
          path: dist/*.tar.zst
          if-no-files-found: error

      - name: Create GitHub Release (optional)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.zst
