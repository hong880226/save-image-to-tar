name: build-wsl-rootfs

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref of openclaw/openclaw to build (tag/branch/commit), e.g. v2026.3.8"
        required: false
        default: "main"
  push:
    tags:
      - "wsl-rootfs-*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout this repo (contains scripts/build-wsl-rootfs.sh)
        uses: actions/checkout@v4

      - name: Checkout OpenClaw source
        uses: actions/checkout@v4
        with:
          repository: openclaw/openclaw
          ref: ${{ inputs.ref }}
          path: openclaw-src

      - name: Setup Node.js (>=22)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm via Corepack
        run: |
          corepack enable
          pnpm -v
          node -v
          npm -v

      - name: Build OpenClaw (pnpm install / ui:build / build)
        working-directory: openclaw-src
        run: |
          pnpm install --frozen-lockfile
          pnpm ui:build
          pnpm build

      - name: Build WSL rootfs (Debian 12) and pack tar.zst
        env:
          REPO_DIR: ${{ github.workspace }}/openclaw-src
        run: |
          chmod +x scripts/build-wsl-rootfs.sh
          sudo -E bash scripts/build-wsl-rootfs.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: openclaw-wsl-rootfs
          path: openclaw-src/dist/*.tar.zst

      - name: Create GitHub Release (only on tag push)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: openclaw-src/dist/*.tar.zst
